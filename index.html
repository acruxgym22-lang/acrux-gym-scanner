<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ACRUX Gym | QR Scanner Test</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #142532; color: white; display: grid; place-items: center; }
    main { width: min(92vw, 460px); text-align: center; padding: 24px 0; }
    h1 { margin-bottom: 0; letter-spacing: .08em; }
    .tag { color: #aabac6; letter-spacing: .12em; font-size: 12px; margin-top: 4px; }
    .preview { margin: 24px 0 12px; border: 2px solid #4a6777; border-radius: 16px; background: #071018; overflow: hidden; aspect-ratio: 4 / 3; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    button { background: #d9e7eb; color: #142532; font-size: 16px; font-weight: 700; border: 0; padding: 15px 24px; border-radius: 10px; margin: 8px; cursor: pointer; }
    button.secondary { background: transparent; border: 1px solid #8ba0ab; color: white; }
    #status { color: #dce9ee; line-height: 1.5; min-height: 45px; overflow-wrap: anywhere; }
    #result { color: #9ce8ba; overflow-wrap: anywhere; font-weight: 600; }
    small { color: #9aaeb9; }
  </style>
</head>
<body>
<main>
  <h1>ACRUX GYM</h1>
  <div class="tag">STRENGTH FOR LIFE</div>
  <h2>QR Scanner — Camera Test</h2>
  <div class="preview"><video id="camera" autoplay muted playsinline></video></div>
  <button id="start">Start Camera</button>
  <button id="stop" class="secondary">Stop</button>
  <p id="status" role="status">Tap Start Camera and allow camera access.</p>
  <p id="result"></p>
  <small>Testing only. No member details are sent or attendance recorded.</small>
</main>
<script>
(() => {
  const video = document.getElementById('camera');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  let stream = null;
  let detector = null;
  let running = false;
  let frameId = null;
  const setStatus = message => { status.textContent = message; };

  async function scanFrame() {
    if (!running) return;
    if (detector && video.readyState >= 2) {
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          result.textContent = 'QR detected: ' + codes[0].rawValue;
          setStatus('QR code successfully read!');
          stopCamera();
          return;
        }
      } catch (error) {
        setStatus('Camera works, but QR decoding failed: ' + error.message);
      }
    }
    if (running) frameId = requestAnimationFrame(scanFrame);
  }

  async function startCamera() {
    stopCamera();
    result.textContent = '';
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus('This browser does not expose camera access on this page.');
      return;
    }
    setStatus('Requesting camera permission…');
    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false});
      } catch (firstError) {
        if (firstError.name !== 'OverconstrainedError' && firstError.name !== 'NotFoundError') throw firstError;
        stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
      }
      video.srcObject = stream;
      await video.play();
      running = true;
      if ('BarcodeDetector' in window) {
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (formats.includes('qr_code')) detector = new BarcodeDetector({formats: ['qr_code']});
        } catch (_) { detector = null; }
      }
      setStatus(detector ? 'Camera is working! Hold a QR code in view.' : 'Camera is working! This Safari version needs a QR-decoding library for scanning.');
      if (detector) scanFrame();
    } catch (error) {
      setStatus('Camera error: ' + error.name + ' — ' + error.message);
    }
  }
  function stopCamera() {
    running = false;
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
  }
  document.getElementById('start').addEventListener('click', startCamera);
  document.getElementById('stop').addEventListener('click', () => { stopCamera(); setStatus('Camera stopped.'); });
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
